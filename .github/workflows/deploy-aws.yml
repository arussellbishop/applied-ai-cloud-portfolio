name: deploy-aws
on:
  workflow_dispatch:
    inputs:
      unhealthy_candidate:
        description: Force an inactive-slot health failure; production must remain healthy
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  ci-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require all four CI workflows for this main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            ready=true
            for workflow in docs.yml quality.yml container.yml security.yml; do
              result=$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&head_sha=$RELEASE_SHA&per_page=10" --jq '.workflow_runs[0] | [.status, .conclusion] | @tsv')
              case "$result" in
                $'completed\tsuccess') ;;
                completed*) echo "CI failed: $workflow"; exit 1 ;;
                *) ready=false ;;
              esac
            done
            if "$ready"; then exit 0; fi
            sleep 10
          done
          echo 'Timed out waiting for CI'; exit 1
  deploy:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy exact SHA with pinned SSH host identity
        env:
          PROBE_MODE: ${{ github.event.inputs.unhealthy_candidate || 'false' }}
          DEPLOY_HOST: ${{ secrets.AWS_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.AWS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$RELEASE_SHA" ]; then
            echo 'Superseded deployment: no traffic change' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          umask 077
          key_dir=$(mktemp -d)
          export REPORT_DIR="$key_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$key_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$key_dir/known_hosts"
          remote() {
            ssh -T -i "$key_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts" \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
              "portfolio-deploy@$DEPLOY_HOST" "$1 $RELEASE_SHA"
          }
          cat > "$key_dir/probe.py" <<'PY'
          import datetime,json,os,time,urllib.request
          from pathlib import Path
          folder=Path(os.environ['REPORT_DIR'])
          with (folder/'http.jsonl').open('w',buffering=1) as output:
              while not (folder/'stop').exists():
                  row={'time':time.time(),'ok':True}
                  for path in ('/','/health'):
                      try:
                          with urllib.request.urlopen('http://'+os.environ['DEPLOY_HOST']+path,timeout=2) as response:
                              body=response.read()
                              row['slot']=response.headers.get('X-Portfolio-Slot')
                              if response.status!=200:row['ok']=False
                              if path=='/health':row['sha']=json.loads(body).get('release')
                      except Exception:row['ok']=False
                  output.write(json.dumps(row)+'\n')
                  time.sleep(0.2)
          PY
          python3 "$key_dir/probe.py" &
          observer=$!
          finish() {
            result=$?
            trap - EXIT
            touch "$key_dir/stop"
            wait "$observer" || true
            remote status > "$key_dir/status.log" 2>&1 || true
            export STEP_RESULT="$result"
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          folder=Path(os.environ['REPORT_DIR'])
          fields=['candidate_sha','active_sha','active_slot','candidate_slot','candidate_health','traffic_switch','external_validation','rollback','final_status']
          report={key:'UNKNOWN' for key in fields}
          report['candidate_sha']=os.environ['RELEASE_SHA']
          for line in (folder/'status.log').read_text().splitlines():
              if line.startswith('REPORT '):report.update(json.loads(line[7:]))
          rows=[json.loads(line) for line in (folder/'http.jsonl').read_text().splitlines()]
          failures=[row for row in rows if not row['ok']]
          intervals=[];start=None
          for row in rows:
              if not row['ok'] and start is None:start=row['time']
              elif row['ok'] and start is not None:intervals.append(row['time']-start);start=None
          if start is not None:intervals.append(rows[-1]['time']-start)
          report['http_samples']=len(rows)
          report['http_failed_samples']=len(failures)
          report['observed_interruption_seconds']=round(sum(intervals),3) if len(rows)>=10 else 'INSUFFICIENT_SAMPLES'
          report['observed_slots']=sorted({r.get('slot') for r in rows if r.get('slot')})
          report['workflow_exit_code']=int(os.environ['STEP_RESULT'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write('### Blue/green deployment report\n\n| Check | Result |\n|---|---|\n')
              for key,value in report.items():output.write(f'| {key} | {value} |\n')
          print('DEPLOYMENT_REPORT '+json.dumps(report))
          PY
            rm -rf "$key_dir"
            exit "$result"
          }
          trap finish EXIT
          operation=deploy
          if [ "$PROBE_MODE" = true ]; then operation=probe; fi
          remote "$operation"
          validate_external() {
            curl --fail --silent --show-error --max-time 10 "http://$DEPLOY_HOST/health" > "$key_dir/health.json" &&
            jq -e --arg sha "$RELEASE_SHA" '.status == "ok" and .release == $sha' "$key_dir/health.json" &&
            curl --fail --silent --show-error --max-time 10 "http://$DEPLOY_HOST/" > "$key_dir/index.html" &&
            grep -q 'Applied AI Systems' "$key_dir/index.html"
          }
          if validate_external; then
            remote confirm
          else
            remote rollback
            exit 1
          fi
