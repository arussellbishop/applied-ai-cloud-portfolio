name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  iac:
    uses: ./.github/workflows/terraform.yml
  quality:
    needs: iac
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every IaC job to pass
        run: test '${{ needs.iac.result }}' = 'success'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/validate_publication.py
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: test -s site/index.html
      - run: python -m unittest discover -s deploy/automation -p 'test_*.py'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Mermaid syntax and tool dependency checks
        run: |
          npm ci --prefix tools/diagrams --ignore-scripts --no-fund
          node tools/diagrams/check.mjs .
          npm audit --prefix tools/diagrams --audit-level=low
